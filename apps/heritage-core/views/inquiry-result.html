<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head><title>{{inquiryLabel}} — Result</title></head>
<body bgcolor="{{bg}}" text="#000000">
  <table width="100%" border="0" cellpadding="6" cellspacing="0" bgcolor="{{primary}}">
    <tr>
      <td><font face="Tahoma, Arial, sans-serif" color="#ffffff" size="3"><b>{{inquiryLabel}} — Result</b></font></td>
    </tr>
  </table>
  <br>
  <table width="560" border="1" cellpadding="6" cellspacing="0" bgcolor="#ffffff" align="center" bordercolor="#808080">
    <tr bgcolor="#ece9d8">
      <td colspan="2"><font face="Tahoma, Arial, sans-serif" size="2"><b>CIF record</b></font></td>
    </tr>
    <tr>
      <td width="220"><font face="Tahoma, Arial, sans-serif" size="2">{{memberIdLabel}}</font></td>
      <td><font face="Tahoma, Arial, sans-serif" size="2">{{memberId}}</font></td>
    </tr>
    <tr>
      <td><font face="Tahoma, Arial, sans-serif" size="2">{{memberNameLabel}}</font></td>
      <td><font face="Tahoma, Arial, sans-serif" size="2">{{memberName}}</font></td>
    </tr>
    <tr>
      <td><font face="Tahoma, Arial, sans-serif" size="2">{{balanceLabel}}</font></td>
      <td><font face="Tahoma, Arial, sans-serif" size="2">{{balance}}</font></td>
    </tr>
    <tr>
      <td><font face="Tahoma, Arial, sans-serif" size="2">Record status</font></td>
      <td><font face="Tahoma, Arial, sans-serif" size="2">Active</font></td>
    </tr>
  </table>
  <p align="center">
    <font face="Tahoma, Arial, sans-serif" size="2"><a href="{{againHref}}" title="{{inquiryLabel}}">New lookup</a></font>
  </p>
</body>
</html>
