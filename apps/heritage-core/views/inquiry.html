<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head><title>{{inquiryLabel}}</title></head>
<body bgcolor="{{bg}}" text="#000000">
  <table width="100%" border="0" cellpadding="6" cellspacing="0" bgcolor="{{primary}}">
    <tr>
      <td><font face="Tahoma, Arial, sans-serif" color="#ffffff" size="3"><b>{{inquiryLabel}}</b></font></td>
    </tr>
  </table>
  <br>
  <table width="520" border="1" cellpadding="0" cellspacing="0" bgcolor="#ffffff" align="center" bordercolor="#808080">
    <tr>
      <td>
        <form method="POST" action="{{action}}" autocomplete="off">
          <table width="100%" border="0" cellpadding="8" cellspacing="0">
            <tr bgcolor="#ece9d8">
              <td colspan="2"><font face="Tahoma, Arial, sans-serif" size="2"><b>Lookup</b></font></td>
            </tr>
            <tr>
              <td width="180"><font face="Tahoma, Arial, sans-serif" size="2">{{memberIdLabel}}</font></td>
              <td><input type="text" name="mid" title="{{memberIdLabel}}" size="16" maxlength="12"></td>
            </tr>
            <tr>
              <td></td>
              <td><input type="submit" value="Search"></td>
            </tr>
          </table>
        </form>
      </td>
    </tr>
  </table>
  <p align="center">
    <font face="Tahoma, Arial, sans-serif" size="1" color="#666666">
      {{memberIdLabel}} must be 5 digits. Host inquiry is posted to the core, not a local cache.
    </font>
  </p>
</body>
</html>
