<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head><title>Scheduled maintenance</title></head>
<body bgcolor="{{bg}}" text="#000000">
  <br><br>
  <table width="480" border="2" cellpadding="0" cellspacing="0" bgcolor="#ffffff" align="center" bordercolor="{{primary}}">
    <tr>
      <td>
        <table width="100%" border="0" cellpadding="6" cellspacing="0" bgcolor="{{primary}}">
          <tr>
            <td><font face="Tahoma, Arial, sans-serif" color="#ffffff" size="2"><b>System Notice</b></font></td>
          </tr>
        </table>
        <form method="POST" action="{{action}}">
          <table width="100%" border="0" cellpadding="12" cellspacing="0">
            <tr>
              <td>
                <font face="Tahoma, Arial, sans-serif" size="2">
                  Scheduled maintenance window 02:00&ndash;04:00 CT.
                  Inquiry remains available. Posting of new products may be delayed.
                </font>
              </td>
            </tr>
            <tr>
              <td align="center">
                <input type="hidden" name="next" value="{{next}}">
                <input type="submit" value="OK">
              </td>
            </tr>
          </table>
        </form>
      </td>
    </tr>
  </table>
</body>
</html>
