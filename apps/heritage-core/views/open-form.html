<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head><title>{{openLabel}}</title></head>
<body bgcolor="{{bg}}" text="#000000">
  <table width="100%" border="0" cellpadding="6" cellspacing="0" bgcolor="{{primary}}">
    <tr>
      <td><font face="Tahoma, Arial, sans-serif" color="#ffffff" size="3"><b>{{openLabel}}</b></font></td>
    </tr>
  </table>
  <br>
  <table width="560" border="1" cellpadding="0" cellspacing="0" bgcolor="#ffffff" align="center" bordercolor="#808080">
    <tr>
      <td>
        <form method="POST" action="{{action}}" autocomplete="off">
          <table width="100%" border="0" cellpadding="8" cellspacing="0">
            <tr bgcolor="#ece9d8">
              <td colspan="2"><font face="Tahoma, Arial, sans-serif" size="2"><b>New product request</b></font></td>
            </tr>
            <tr>
              <td colspan="2">
                <font face="Tahoma, Arial, sans-serif" size="2" color="#990000"><b>{{error}}</b></font>
              </td>
            </tr>
            <tr>
              <td width="180"><font face="Tahoma, Arial, sans-serif" size="2">{{memberIdLabel}}</font></td>
              <td><input type="text" name="mid" title="{{memberIdLabel}}" size="16" maxlength="12"></td>
            </tr>
            <tr>
              <td><font face="Tahoma, Arial, sans-serif" size="2">{{productTypeLabel}}</font></td>
              <td>
                <select name="ptype" title="{{productTypeLabel}}">
                  <option value="savings">Savings</option>
                </select>
              </td>
            </tr>
            <tr>
              <td></td>
              <td><input type="submit" value="Submit"></td>
            </tr>
          </table>
        </form>
      </td>
    </tr>
  </table>
</body>
</html>
