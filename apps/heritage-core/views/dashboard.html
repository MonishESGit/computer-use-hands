<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head><title>Teller Home</title></head>
<body bgcolor="{{bg}}" text="#000000">
  <table width="100%" border="0" cellpadding="6" cellspacing="0" bgcolor="{{primary}}">
    <tr>
      <td><font face="Tahoma, Arial, sans-serif" color="#ffffff" size="3"><b>Teller Home</b></font></td>
    </tr>
  </table>
  <br>
  <table width="92%" border="1" cellpadding="8" cellspacing="0" bgcolor="#ffffff" align="center" bordercolor="#808080">
    <tr bgcolor="#ece9d8">
      <td colspan="2"><font face="Tahoma, Arial, sans-serif" size="2"><b>Workstation status</b></font></td>
    </tr>
    <tr>
      <td width="220"><font face="Tahoma, Arial, sans-serif" size="2">Institution</font></td>
      <td><font face="Tahoma, Arial, sans-serif" size="2">{{institution}}</font></td>
    </tr>
    <tr>
      <td><font face="Tahoma, Arial, sans-serif" size="2">Signed on</font></td>
      <td><font face="Tahoma, Arial, sans-serif" size="2">{{teller}}</font></td>
    </tr>
    <tr>
      <td><font face="Tahoma, Arial, sans-serif" size="2">Core batch window</font></td>
      <td><font face="Tahoma, Arial, sans-serif" size="2">02:00&ndash;04:00 CT (read-only during window)</font></td>
    </tr>
  </table>
  <p>
    <font face="Tahoma, Arial, sans-serif" size="2">
      &nbsp;&nbsp;Use the header menu for <b>{{inquiryLabel}}</b> or <b>{{openLabel}}</b>.
    </font>
  </p>
</body>
</html>
