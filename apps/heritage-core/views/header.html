<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
  <title>header</title>
  <base target="main">
</head>
<body bgcolor="{{primary}}" text="#ffffff" link="#ffffff" vlink="#ffffff" leftmargin="0" topmargin="0">
  <table width="100%" border="0" cellpadding="6" cellspacing="0">
    <tr>
      <td>
        <font face="Tahoma, Arial, sans-serif" color="#ffffff" size="3"><b>{{institution}}</b></font>
        &nbsp;
        <font face="Tahoma, Arial, sans-serif" color="{{accent}}" size="1">CORE 4.2</font>
      </td>
      <td align="right">
        <font face="Tahoma, Arial, sans-serif" size="2">
          <a href="{{homeHref}}" title="Teller Home">{{homeLabel}}</a>
          &nbsp;|&nbsp;
          <a href="{{inquiryHref}}" title="{{inquiryLabel}}">{{inquiryLabel}}</a>
          &nbsp;|&nbsp;
          <a href="{{openHref}}" title="{{openLabel}}">{{openLabel}}</a>
          &nbsp;|&nbsp;
          <a href="{{logoutHref}}" title="Sign Off" target="_top">Sign Off</a>
        </font>
        <br>
        <font face="Tahoma, Arial, sans-serif" size="1">Teller: {{teller}} &nbsp; Session {{sessionShort}}</font>
      </td>
    </tr>
  </table>
</body>
</html>
